    <style>
      /* Fondo del color del tema desde el primer instante (los estilos de la app cargan después).
         La apertura la muestra el propio sistema (Android/iPhone) hasta que la app está lista. */
      html { background: #F7F5F3; }
      html.dark { background: #1C1A18; }
    </style>
  </head>

  <body>
    <script>
      // Tema oscuro antes de dibujar nada; también barra del celular y manifiesto oscuro
      // (para que la apertura de Android al instalar sea oscura). Ver src/hooks/useTheme.ts.
      (function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content','#1C1A18');
        var m=document.querySelector('link[rel="manifest"]');if(m)m.href='/manifest-oscuro.webmanifest';}}catch(e){}})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
