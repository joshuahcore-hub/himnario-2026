    <style>
      /* Apertura: fondo blanco con el ícono, igual que la pantalla del sistema; se desvanece al cargar la app. */
      #apertura { position: fixed; inset: 0; z-index: 9999; background: #fff; display: flex; flex-direction: column;
                  align-items: center; justify-content: center; transition: opacity 250ms ease-out; }
      #apertura img { width: 56vw; max-width: 300px; height: auto; }
      #apertura span { margin-top: 8px; font: 600 22px/1.2 "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
                       letter-spacing: 1px; color: #4AA8E8; }
      #apertura.oculta { opacity: 0; pointer-events: none; }
      /* Modo oscuro de la app: fondo oscuro de la app (hsl 30 8% 10%) y el ícono sobre ese fondo. */
      #apertura .oscuro, .dark #apertura .claro { display: none; }
      .dark #apertura { background: #1C1A18; }
      .dark #apertura .oscuro { display: block; }
    </style>

  <body>
    <script>
      (function(){try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
    </script>
    <div id="apertura" aria-hidden="true">
      <img class="claro" src="/icon-512.png" alt="" />
      <img class="oscuro" src="/icon-oscuro-512.png" alt="" />
      <span>Himnario 2026</span>
    </div>
